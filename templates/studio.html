<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="vendor/fonts.css">
<style>{{theme.css}}</style></head>
<body>
<div id="world"><div id="cam">
<!-- BEGIN SHOTS -->

<!-- Demo: a real WhatsApp chat on a phone, not an icon. One stage, several beats inside it. -->
<section class="shot" id="s01">
  <div class="stage" id="s01st">
    <div class="phone" id="s01ph" style="left:230px;top:400px">
      <div class="island"></div>
      <div class="screen">
        <div class="statusbar wa-sb"><span>9:41</span><span class="sig"></span></div>
        <div class="wa-head"><span class="back">←</span><div class="avatar" style="background:#e17055">M</div><div class="who"><b>Mum</b><small id="s01st8">online</small></div><span class="icons">📹📞</span></div>
        <div class="wa">
          <div class="wa-msgs">
            <div class="wa-day">TODAY</div>
            <div class="wa-lock">🔒 Messages and calls are end-to-end encrypted. No one outside of this chat can read them.</div>
            <div class="wa-out" id="s01m1">Did you get the money? <span class="wa-meta">9:41<span class="tk read">✓✓</span></span></div>
            <div class="wa-in" id="s01m2">Yes! Just came in 🙏 <span class="wa-meta">9:41</span></div>
          </div>
          <div class="wa-input"><div class="field">🙂 <span>Message</span></div><div class="mic">🎤</div></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="shot dark" id="s02">
  <div class="ui-card" id="s02c" style="left:110px;right:110px;top:560px">
    <div class="label">END-TO-END ENCRYPTION</div>
    <div class="num" style="font-size:180px;margin:16px 0" ><span id="s02n">0</span><span class="accent">B</span></div>
    <div style="font:500 30px var(--ui);color:#8c8c95">messages a day nobody else can read</div>
  </div>
</section>

<!-- END SHOTS -->
</div></div>
<canvas id="grain" width="{{grainWidth}}" height="{{grainHeight}}"></canvas>
<div id="vig"></div><div id="flash"></div><div id="pinkflash"></div>
<div id="cursor"><span class="rip"></span><svg viewBox="0 0 24 24"><path d="M4 2l15 10-6.5 1.4L16.5 21l-3 1.4-3.6-7.6L4 19z" fill="#16161a" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
<div id="captions"><div id="capbox"></div></div>
<div id="sig">@{{brand.handleWithoutAt}}</div>
<div id="prog"></div>

<script src="vendor/gsap.min.js"></script>
<script src="words.js"></script>
<script>
const D = {{duration}}, E = "power2.out", EI = "power2.inOut", EX = "expo.out", BK = "back.out(1.7)";
const tl = gsap.timeline({paused:true});
const THEME = Object.assign({enter:null, shake:1, flash:1, pulse:1}, {{theme.motion}});
const SFX = [];
const q = s => document.querySelector(s);
const qa = s => [...document.querySelectorAll(s)];

const SHOTS = [];
function shot(id, s, e, enter){
  SHOTS.push({id, s, e, el:q("#"+id)});
  tl.set("#"+id,{visibility:"visible"},s);
  tl.set("#"+id,{visibility:"hidden"},e);
  if(enter === undefined) enter = THEME.enter;
  if(enter === "soft"){ tl.fromTo("#"+id,{scale:1.04,opacity:0,filter:"blur(14px)"},{scale:1,opacity:1,filter:"blur(0px)",duration:.4,ease:E},s); }
  if(enter === "push"){ tl.fromTo("#"+id,{yPercent:12,opacity:0},{yPercent:0,opacity:1,duration:.45,ease:EX},s); SFX.push({t:s-.08,type:"whoosh"}); }
  if(enter === "slide"){ tl.fromTo("#"+id,{xPercent:100},{xPercent:0,duration:.45,ease:"power3.out"},s); SFX.push({t:s-.12,type:"whoosh"}); }
  if(enter === "whip"){ tl.fromTo("#"+id,{xPercent:40,filter:"blur(30px)"},{xPercent:0,filter:"blur(0px)",duration:.28,ease:EX},s); SFX.push({t:s-.12,type:"whoosh"}); }
  if(enter === "zoom"){ tl.fromTo("#"+id,{scale:1.3,filter:"blur(20px)",opacity:0},{scale:1,filter:"blur(0px)",opacity:1,duration:.35,ease:EX},s); SFX.push({t:s-.1,type:"whoosh"}); }
  if(enter === "fade"){ tl.fromTo("#"+id,{opacity:0},{opacity:1,duration:.5,ease:E},s); }
  if(enter === "iris"){ tl.fromTo("#"+id,{clipPath:"circle(0% at 50% 50%)"},{clipPath:"circle(120% at 50% 50%)",duration:.55,ease:"power2.in"},s); SFX.push({t:s-.1,type:"whoosh"}); }
}
function hit(t, power=1){
  SFX.push({t,type:"hit",power});
  const flash = power*THEME.flash; power *= THEME.shake;
  tl.fromTo("#cam",{scale:1+.04*power},{scale:1,duration:.45,ease:EX,immediateRender:false},t);
  if(flash>0) tl.fromTo("#flash",{opacity:.3*flash},{opacity:0,duration:.3,ease:E,immediateRender:false},t);
}
function slam(sel, t, power=1){ tl.fromTo(sel,{scale:1.8,opacity:0,filter:"blur(16px)"},{scale:1,opacity:1,filter:"blur(0px)",duration:.22,ease:EX},t-.08); hit(t, power); }
function rise(sel, t, d=.45){ tl.fromTo(sel,{y:60,opacity:0},{y:0,opacity:1,duration:d,ease:EX},t); }
function pop(sel, t, sound=true){ tl.fromTo(sel,{scale:.6,opacity:0},{scale:1,opacity:1,duration:.4,ease:BK},t); if(sound) SFX.push({t,type:"pop"}); }
function out(sel, t, d=.3){ tl.to(sel,{opacity:0,y:-30,filter:"blur(8px)",duration:d,ease:"power2.in"},t); }
function stamp(sel, t){ tl.fromTo(sel,{scale:2.4,opacity:0,rotate:-8},{scale:1,opacity:1,rotate:-8,duration:.2,ease:EX},t); SFX.push({t,type:"stamp"}); }
function drift(sel, s, e, from, to){ tl.fromTo(sel,from,{...to,duration:e-s,ease:"none"},s); }
function kenBurns(sel, s, e, dir="in"){
  const wide = {scale:1, xPercent:0}, close = {scale:1.15, xPercent:dir==="left"?-4:dir==="right"?4:0};
  tl.fromTo(sel, dir==="out"?close:wide, {...(dir==="out"?wide:close), duration:e-s, ease:"none"}, s);
}
// A list appearing one row at a time, each row a soft tick
function stagger(sel, t, gap=.12){ qa(sel).forEach((el,i)=>{ tl.fromTo(el,{y:30,opacity:0},{y:0,opacity:1,duration:.35,ease:EX},t+i*gap); SFX.push({t:t+i*gap,type:"tick",dur:.04}); }); }

// ---------- interaction helpers: the audience should see the interface being *used* ----------
// Selection box with corner handles drawn around any element (it gets position:relative)
function select(sel, t, label){
  const el = q(sel); if(getComputedStyle(el).position==="static") el.style.position="relative";
  const box = document.createElement("span"); box.className="sel"; box.innerHTML="<i></i><i></i><i></i><i></i>"+(label?`<b>${label}</b>`:"");
  el.appendChild(box);
  tl.fromTo(box,{opacity:0,scale:1.15},{opacity:1,scale:1,duration:.3,ease:EX},t); SFX.push({t,type:"pop"});
  return box;
}
// Dim everything in `others` so the eye lands on `sel`
function focus(sel, others, t, d=.35){
  tl.to(qa(others).filter(el=>el!==q(sel)),{opacity:.22,filter:"blur(2px)",duration:d,ease:E},t);
  tl.fromTo(sel,{scale:1},{scale:1.04,duration:d,ease:E},t);
}
function unfocus(others, t, d=.35){ tl.to(others,{opacity:1,filter:"blur(0px)",scale:1,duration:d,ease:E},t); }
// The cursor travels to the centre of `sel` and clicks at `t`
let cursorFrom = null;
function click(sel, t, travel=.5){
  const r = q(sel).getBoundingClientRect(), x = r.left+r.width/2, y = r.top+r.height/2;
  const from = cursorFrom || {x:x+260, y:y+320};
  tl.fromTo("#cursor",{x:from.x,y:from.y,opacity:cursorFrom?1:0},{x,y,opacity:1,duration:travel,ease:EI,immediateRender:false},t-travel);
  tl.fromTo("#cursor svg",{scale:1},{scale:.82,duration:.08,yoyo:true,repeat:1,immediateRender:false},t);
  tl.fromTo("#cursor .rip",{scale:.3,opacity:1},{scale:2.2,opacity:0,duration:.45,ease:E,immediateRender:false},t);
  tl.fromTo(sel,{scale:1},{scale:.96,duration:.08,yoyo:true,repeat:1,immediateRender:false},t);
  SFX.push({t,type:"click"}); cursorFrom = {x,y};
}
function cursorOff(t){ tl.to("#cursor",{opacity:0,duration:.2},t); cursorFrom = null; }
// Progress / usage bar filling to pct (0-100)
function fill(sel, pct, s, e){ tl.fromTo(sel,{width:"0%"},{width:pct+"%",duration:e-s,ease:"power1.inOut"},s); }
// Checkbox ticks with a ding
function check(sel, t){ addClass(sel,"on",t); tl.fromTo(sel,{scale:.6},{scale:1,duration:.35,ease:BK,immediateRender:false},t); SFX.push({t,type:"ding"}); }
// A chat bubble arriving (WhatsApp / SMS). typing>0 shows dots in `dots` first
function msg(sel, t, dots){
  if(dots){ tl.fromTo(dots,{opacity:0,scale:.8},{opacity:1,scale:1,duration:.2},t-.9); tl.set(dots,{display:"none"},t); }
  tl.fromTo(sel,{y:40,scale:.85,opacity:0,transformOrigin:"50% 100%"},{y:0,scale:1,opacity:1,duration:.35,ease:BK},t);
  SFX.push({t,type:"msg"});
}
// A notification banner dropping in from above
function notify(sel, t){ tl.fromTo(sel,{y:-260,opacity:0},{y:0,opacity:1,duration:.5,ease:BK},t); SFX.push({t,type:"msg"}); }
// Camera push into one element inside a .stage, then back out with zoomOut
function zoomTo(stage, sel, t, d=.8, scale=1.6){
  const W = {{width}}, H = {{height}}, r = q(sel).getBoundingClientRect();
  // The stage scales about its centre, so solve for the shift that lands the element at (W/2, 0.55H)
  const dx = scale*(W/2 - (r.left+r.width/2)), dy = .05*H + scale*(H/2 - (r.top+r.height/2));
  tl.to(stage,{x:dx,y:dy,scale,duration:d,ease:EI},t);
}
function zoomOut(stage, t, d=.8){ tl.to(stage,{x:0,y:0,scale:1,duration:d,ease:EI},t); }

const TYPERS = [], COUNTERS = [], LABELS = [];
function typer(el, text, s, e){ TYPERS.push({el:q(el),text,s,e}); SFX.push({t:s,type:"type",dur:e-s}); }
function counter(el, from, to, s, e, sep=false, dec=0){ COUNTERS.push({el:q(el),from,to,s,e,sep,dec}); SFX.push({t:s,type:"tick",dur:e-s}); }
// Text that changes at set times: label("#chip", [[0,"OFFLINE"],[8.2,"BROADCASTING"]])
function label(el, steps){ LABELS.push({el:q(el),steps}); }
// Class switched on at t and kept (seek-safe, unlike a GSAP className tween): addClass("#pill2","on",6.1)
const CLASSES = [];
function addClass(sel, cls, t){ qa(sel).forEach(el=>CLASSES.push({el,cls,t})); }

const MEDIA = [];
function faceCam(id, s, e, enter){ shot(id, s, e, enter); MEDIA.push({img:q("#"+id+">img"),dir:"face",fix:"extract_face.sh",s,e}); }
function clip(sel, name, s, e){ MEDIA.push({img:q(sel),dir:"clips/"+name,fix:`extract_clip.sh … ${name} ${s} ${e}`,s,e}); }
function broll(sel, name, s, e){ clip(sel, name, s, e); }

const TERMINALS = [];
function terminal(el, lines){ TERMINALS.push({el:q(el),lines}); lines.forEach(l=>{ if(l.e>l.t) SFX.push({t:l.t,type:"type",dur:l.e-l.t}); }); }

// Words that get the selection-box treatment in the headline, by spoken time: key(4.6) or key(4.6,"🔥")
const KEYS = [];
function key(t, emoji){ KEYS.push({t, emoji}); SFX.push({t,type:"pop"}); }

// BEGIN TIMELINE
shot("s01",0,4.2,"soft");
rise("#s01ph",0.05,.6);
msg("#s01m1",0.9);
msg("#s01m2",2.0);
label("#s01st8",[[0,"online"],[1.4,"typing…"],[2.0,"online"]]);
select("#s01m2",2.6,"delivered");
key(2.6,"✅");
zoomTo("#s01st","#s01m2",3.0,.8,1.5);

shot("s02",4.2,D,"push");
counter("#s02n",0,100,4.5,5.6);
hit(5.6,.6);
// END TIMELINE

// Captions hide where the spoken word is already the visual: [[from, to], …]
const NOCAP = [];

// Headline captions: a phrase shows at the top, words appear as they're spoken, the newest is dark,
// earlier ones grey, KEYS get a selection box. Long phrases split into chunks so it stays ≤ 2 lines.
const CHUNK = 6;
const capbox = q("#capbox"); let lastChunk = null;
const CHUNKS = [];
(window.PHRASES||[]).forEach(p=>{ for(let i=0;i<p.length;i+=CHUNK) CHUNKS.push(p.slice(i,i+CHUNK)); });
function renderCaptions(t){
  const hidden = NOCAP.some(([a,b])=>t>=a&&t<b);
  const idx = CHUNKS.findIndex((p,i)=>{const n=CHUNKS[i+1];return t>=p[0].s-.05 && t<(n?Math.min(n[0].s-.05,p[p.length-1].e+.8):p[p.length-1].e+.8);});
  if(hidden || idx<0){ capbox.style.visibility="hidden"; return; }
  capbox.style.visibility="visible";
  const ch = CHUNKS[idx];
  if(ch!==lastChunk){
    capbox.innerHTML = ch.map(w=>{
      const k = KEYS.find(k=>Math.abs(k.t-w.s)<.12);
      return `<span${k?' data-key="1"':''}>${w.t}${k?'<i class="h" style="left:-17px;top:-9px"></i><i class="h" style="right:-17px;top:-9px"></i><i class="h" style="left:-17px;bottom:-11px"></i><i class="h" style="right:-17px;bottom:-11px"></i>':''}${k&&k.emoji?`<span class="emo">${k.emoji}</span>`:''}</span>`;
    }).join("");
    lastChunk = ch;
  }
  [...capbox.children].forEach((el,i)=>{
    const w = ch[i], key = el.dataset.key && t>=w.s;
    const now = t>=w.s && (i===ch.length-1 || t<ch[i+1].s);
    el.className = (t<w.s ? "" : now ? "now" : "on") + (key ? " key" : "");
    const k = Math.min(1, Math.max(0,(t-w.s)/.18));
    el.style.opacity = t<w.s ? 0 : k; el.style.filter = t<w.s ? "blur(8px)" : `blur(${(1-k)*8}px)`;
    el.style.transform = `translateY(${(1-k)*14}px)`;
  });
}

function renderText(t){
  TYPERS.forEach(({el,text,s,e})=>{ const n = t<s?0:t>=e?text.length:Math.floor((t-s)/(e-s)*text.length); el.textContent = text.slice(0,n); });
  COUNTERS.forEach(({el,from,to,s,e,sep,dec})=>{
    const k = t<s?0:t>=e?1:(t-s)/(e-s);
    const n = from+(to-from)*(1-Math.pow(1-k,3));
    el.textContent = sep ? n.toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec}) : n.toFixed(dec);
  });
  CLASSES.forEach(({el,cls,t:at})=>el.classList.toggle(cls, t>=at));
  LABELS.forEach(({el,steps})=>{ let txt = steps[0][1]; steps.forEach(([at,s])=>{ if(t>=at) txt = s; }); if(el.textContent!==txt) el.textContent = txt; });
  TERMINALS.forEach(({el,lines})=>{
    let html = "";
    lines.forEach(l=>{ if(t<l.t) return; const k = l.e>l.t?Math.min(1,(t-l.t)/(l.e-l.t)):1; html += k<1?l.html.slice(0,Math.floor(l.html.length*k)):l.html; });
    el.innerHTML = html + "<span class='caret'></span>";
  });
}
// Light headline on dark shots
function renderChrome(t){ document.body.classList.toggle("dark-cap", SHOTS.some(s=>t>=s.s&&t<s.e&&s.el&&s.el.classList.contains("dark"))); }

function renderMedia(t, frame){
  return Promise.all(MEDIA.filter(({s,e})=>t>=s&&t<e).map(({img,dir,fix})=>{
    const src = `${dir}/f${String(frame).padStart(5,"0")}.jpg`;
    if(img.getAttribute("src")===src) return null;
    img.src = src;
    return img.decode().catch(()=>{ throw new Error(`missing frame ${src} at t=${t.toFixed(2)}; re-run ${fix} with this shot's in/out`); });
  }));
}

window.SFX = SFX; window.DURATION = D; window.SHOTS = SHOTS.map(({id,s,e})=>({id,s,e}));
window.renderAt = t => { const frame = Math.round(t*30); tl.seek(t,false); renderCaptions(t); renderText(t); renderChrome(t); return renderMedia(t, frame); };
</script>
</body></html>
